services:
  learning-os:
    build: .
    image: learning-os:latest
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
    restart: unless-stopped

  # Optional: hot-reloading dev container (`docker compose up dev`)
  dev:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    ports:
      - "8081:8080"
    volumes:
      - .:/app
      - /app/node_modules
    profiles: ["dev"]
